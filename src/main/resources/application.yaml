spring:
  application:
    name: jobtracker

  datasource:
    url: jdbc:${POSTGRES_URI}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    org.flywaydb: DEBUG

jwt:
  secret: ${JWT_SECRET:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdCYXNlNjRTZWNyZXRGb3JEZXZlbG9wbWVudA==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}